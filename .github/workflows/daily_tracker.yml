name: Daily Internship Tracker

on:
  schedule:
    - cron: "0 8 * * *"   # Runs daily at 8:00 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests beautifulsoup4

      - name: Verify Gemini secret exists
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "ERROR: GEMINI_API_KEY is missing from GitHub repository secrets."
            exit 1
          fi
          echo "GEMINI_API_KEY is configured."

      - name: Create docs directory and empty JSON file if needed
        run: |
          mkdir -p docs
          if [ ! -f docs/jobs.json ]; then
            printf '%s\n' '{"updated_on": null, "jobs": []}' > docs/jobs.json
          fi
          ls -l docs

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      - name: Show git status
        run: |
          git status --short

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/jobs.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update internship postings [skip ci]"
          git push
